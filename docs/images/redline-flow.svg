<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="880" height="132" role="img" aria-label="Press the hotkey, mark and comment, saved to history, agent fixes it, you confirm">
<title>How Redline works</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes s0{0%,0.00%{opacity:.45}3.50%,20.00%{opacity:1}23.50%,100%{opacity:.45}}.s0{opacity:.45;animation:s0 10.0s infinite}@keyframes b0{0%,0.00%{transform:scaleX(0)}20.00%{transform:scaleX(1)}23.50%,100%{transform:scaleX(0)}}.b0{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:b0 10.0s infinite linear}@keyframes s1{0%,19.99%{opacity:.45}23.50%,40.00%{opacity:1}43.50%,100%{opacity:.45}}.s1{opacity:.45;animation:s1 10.0s infinite}@keyframes b1{0%,19.99%{transform:scaleX(0)}40.00%{transform:scaleX(1)}43.50%,100%{transform:scaleX(0)}}.b1{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:b1 10.0s infinite linear}@keyframes s2{0%,39.99%{opacity:.45}43.50%,60.00%{opacity:1}63.50%,100%{opacity:.45}}.s2{opacity:.45;animation:s2 10.0s infinite}@keyframes b2{0%,39.99%{transform:scaleX(0)}60.00%{transform:scaleX(1)}63.50%,100%{transform:scaleX(0)}}.b2{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:b2 10.0s infinite linear}@keyframes s3{0%,59.99%{opacity:.45}63.50%,80.00%{opacity:1}83.50%,100%{opacity:.45}}.s3{opacity:.45;animation:s3 10.0s infinite}@keyframes b3{0%,59.99%{transform:scaleX(0)}80.00%{transform:scaleX(1)}83.50%,100%{transform:scaleX(0)}}.b3{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:b3 10.0s infinite linear}@keyframes s4{0%,79.99%{opacity:.45}83.50%,100.00%{opacity:1}100.00%,100%{opacity:.45}}.s4{opacity:.45;animation:s4 10.0s infinite}@keyframes b4{0%,79.99%{transform:scaleX(0)}100.00%{transform:scaleX(1)}100.00%,100%{transform:scaleX(0)}}.b4{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:b4 10.0s infinite linear}</style>
<rect width="880" height="132" rx="12" fill="#f6f5f0"/>
<g class="s0"><text x="28.0" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6b6e66" letter-spacing=".06em">01</text>
<text x="28.0" y="72" font-size="16" font-weight="600" fill="#1f211d">Press</text>
<text x="28.0" y="94" font-size="12" fill="#6b6e66">⌥⇧M / Alt+Shift+M</text></g>
<rect x="24.0" y="18" width="158.4" height="2" fill="#d3d4cb"/><rect class="b0" x="24.0" y="18" width="158.4" height="2" fill="#f0452b"/><g class="s1"><text x="194.4" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6b6e66" letter-spacing=".06em">02</text>
<text x="194.4" y="72" font-size="16" font-weight="600" fill="#1f211d">Mark &amp; comment</text>
<text x="194.4" y="94" font-size="12" fill="#6b6e66">box · arrow · pen · pin</text></g>
<rect x="190.4" y="18" width="158.4" height="2" fill="#d3d4cb"/><rect class="b1" x="190.4" y="18" width="158.4" height="2" fill="#f0452b"/><g class="s2"><text x="360.8" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6b6e66" letter-spacing=".06em">03</text>
<text x="360.8" y="72" font-size="16" font-weight="600" fill="#1f211d">Saved to history</text>
<text x="360.8" y="94" font-size="12" fill="#6b6e66">~/.redline/requests</text></g>
<rect x="356.8" y="18" width="158.4" height="2" fill="#d3d4cb"/><rect class="b2" x="356.8" y="18" width="158.4" height="2" fill="#f0452b"/><g class="s3"><text x="527.2" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6b6e66" letter-spacing=".06em">04</text>
<text x="527.2" y="72" font-size="16" font-weight="600" fill="#1f211d">Agent fixes it</text>
<text x="527.2" y="94" font-size="12" fill="#6b6e66">via the Redline MCP</text></g>
<rect x="523.2" y="18" width="158.4" height="2" fill="#d3d4cb"/><rect class="b3" x="523.2" y="18" width="158.4" height="2" fill="#f0452b"/><g class="s4"><text x="693.6" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6b6e66" letter-spacing=".06em">05</text>
<text x="693.6" y="72" font-size="16" font-weight="600" fill="#1f211d">You confirm</text>
<text x="693.6" y="94" font-size="12" fill="#6b6e66">✓ Looks good</text></g>
<rect x="689.6" y="18" width="158.4" height="2" fill="#d3d4cb"/><rect class="b4" x="689.6" y="18" width="158.4" height="2" fill="#f0452b"/>
</svg>