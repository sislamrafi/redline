<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Redline: mark up a checkout button, your AI agent makes it full width">
<title>Redline: point at it, your agent fixes it</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}@keyframes ov{0%,8.32%{opacity:0;}10.83%,38.33%{opacity:1;}40.83%,100%{opacity:0;}}.ov{opacity:0;animation:ov 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes badge{0%,21.66%{opacity:0;}24.17%,38.33%{opacity:1;}40.83%,100%{opacity:0;}}.badge{opacity:0;animation:badge 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes chip{0%,24.16%{opacity:0;transform:translateY(4px);}26.67%,38.33%{opacity:1;transform:translateY(0);}40.83%,100%{opacity:0;transform:translateY(4px);}}.chip{opacity:0;animation:chip 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes saved{0%,39.16%{opacity:0;transform:translateY(4px);}41.67%,52.50%{opacity:1;transform:translateY(0);}55.00%,100%{opacity:0;transform:translateY(4px);}}.saved{opacity:0;animation:saved 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes l1{0%,51.66%{opacity:0;}54.17%,95.00%{opacity:1;}97.50%,100%{opacity:0;}}.l1{opacity:0;animation:l1 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes l2{0%,57.49%{opacity:0;}60.00%,95.00%{opacity:1;}97.50%,100%{opacity:0;}}.l2{opacity:0;animation:l2 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes l3{0%,63.32%{opacity:0;}65.83%,95.00%{opacity:1;}97.50%,100%{opacity:0;}}.l3{opacity:0;animation:l3 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes l4{0%,74.99%{opacity:0;}77.50%,95.00%{opacity:1;}97.50%,100%{opacity:0;}}.l4{opacity:0;animation:l4 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes rv{0%,75.82%{opacity:0;transform:translateY(4px);}78.33%,95.00%{opacity:1;transform:translateY(0);}97.50%,100%{opacity:0;transform:translateY(4px);}}.rv{opacity:0;animation:rv 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes draw{0%,14.17%{stroke-dashoffset:520;opacity:1}21.67%,36.67%{stroke-dashoffset:0;opacity:1}39.17%,100%{stroke-dashoffset:0;opacity:0}}.box{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 12.0s infinite cubic-bezier(.22,.7,.24,1)}@keyframes cur{0%,10.00%{transform:translate(392px,392px)}14.17%{transform:translate(78px,300px)}21.67%{transform:translate(206px,346px)}30.00%,66.67%{transform:translate(330px,380px)}75.00%,100%{transform:translate(392px,392px)}}.cur{animation:cur 12.0s infinite cubic-bezier(.45,.05,.3,1)}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.caret{animation:blink 1s steps(1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.box,.badge,.chip{opacity:1;stroke-dashoffset:0}}</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e4e3dc" stroke-width="1"/></pattern>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f211d" flood-opacity=".10"/></filter>
</defs>
<rect width="880" height="440" rx="14" fill="#f6f5f0"/>
<rect width="880" height="440" rx="14" fill="url(#grid)"/>

<!-- app window -->
<g filter="url(#sh)">
  <rect x="24" y="24" width="400" height="392" rx="10" fill="#fff" stroke="#d3d4cb"/>
</g>
<path d="M24 34a10 10 0 0 1 10-10h380a10 10 0 0 1 10 10v24H24z" fill="#f1f0ea"/>
<line x1="24" y1="58" x2="424" y2="58" stroke="#d3d4cb"/>
<circle cx="44" cy="41" r="5" fill="#ff5f57"/><circle cx="61" cy="41" r="5" fill="#febc2e"/><circle cx="78" cy="41" r="5" fill="#28c840"/>
<rect x="150" y="32" width="160" height="18" rx="4" fill="#fff" stroke="#e4e3dc"/>
<text x="230" y="45" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6b6e66">localhost:3000/checkout</text>
<text x="46" y="88" font-size="14" font-weight="700" fill="#1f211d">acme</text>
<text x="330" y="88" font-size="11" fill="#6b6e66">Pricing</text><text x="376" y="88" font-size="11" fill="#6b6e66">Docs</text>

<!-- checkout card -->
<rect x="58" y="112" width="332" height="270" rx="10" fill="#fcfbf8" stroke="#e7e6df"/>
<text x="82" y="148" font-size="19" font-weight="700" fill="#1f211d">Checkout</text>
<text x="82" y="168" font-size="11.5" fill="#6b6e66">Review your order</text>
<text x="82" y="204" font-size="12.5" fill="#44473f">Pro plan · yearly</text><text x="366" y="204" text-anchor="end" font-size="12.5" fill="#44473f">$96.00</text>
<text x="82" y="232" font-size="12.5" fill="#44473f">Tax <tspan font-size="10.5" fill="#6b6e66">8%</tspan></text><text x="366" y="232" text-anchor="end" font-size="12.5" fill="#44473f">$7.68</text>
<line x1="82" y1="250" x2="366" y2="250" stroke="#d3d4cb" stroke-dasharray="3 3"/>
<text x="82" y="274" font-size="13" font-weight="600" fill="#1f211d">Total</text><text x="366" y="274" text-anchor="end" font-size="13" font-weight="700" fill="#1f211d">$103.68</text>
<rect x="82" y="296" width="112" height="34" rx="6" fill="#1f211d"><animate attributeName="width" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.22 .7 .24 1;0 0 1 1;.22 .7 .24 1;0 0 1 1" keyTimes="0.0000;0.7500;0.8000;0.9500;0.9917;1.0000" values="112;112;284;284;112;112"/></rect>
<text y="318" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">Pay now<animate attributeName="x" dur="12.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.22 .7 .24 1;0 0 1 1;.22 .7 .24 1;0 0 1 1" keyTimes="0.0000;0.7500;0.8000;0.9500;0.9917;1.0000" values="106;106;224;224;106;106"/></text>
<text x="82" y="356" font-size="10.5" fill="#6b6e66">Secured by Stripe · Cancel anytime</text>

<!-- Redline capture overlay -->
<g class="ov">
  <rect x="25.5" y="59.5" width="397" height="355" fill="#f0452b" fill-opacity=".04" stroke="#f0452b" stroke-width="3"/>
  <rect x="104" y="72" width="240" height="30" rx="8" fill="#171815"/>
  <rect x="110" y="77" width="22" height="20" rx="5" fill="#f0452b"/><rect x="116" y="83" width="10" height="8" rx="1.5" fill="none" stroke="#fff" stroke-width="1.4"/>
  <text x="146" y="92" font-size="11" fill="#9a9d93">↗   ✎   ⦿</text>
  <text x="222" y="92" font-size="10.5" fill="#e9eae3">History   Undo</text>
  <rect x="300" y="77" width="38" height="20" rx="5" fill="#3b6cf6"/><text x="319" y="91" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff">Save</text>
</g>
<rect class="box" x="74" y="288" width="128" height="50" rx="5" fill="none" stroke="#f0452b" stroke-width="2.5"/>
<g class="badge"><circle cx="74" cy="288" r="10" fill="#f0452b" stroke="#fff" stroke-width="2"/><text x="74" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text></g>
<g class="chip"><rect x="210" y="302" width="178" height="22" rx="4" fill="#f0452b"/><text x="219" y="317" font-size="11.5" font-weight="600" fill="#fff">make the button full width</text></g>
<g class="saved"><rect x="150" y="380" width="148" height="24" rx="12" fill="#171815"/><text x="224" y="396" text-anchor="middle" font-size="11" fill="#e9eae3">✓ Saved to history</text></g>

<!-- cursor -->
<g class="cur"><path d="M0 0v17l4.6-4.3 3 6.6 2.8-1.3-3-6.4H14z" fill="#1f211d" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></g>

<!-- agent terminal -->
<g filter="url(#sh)"><rect x="448" y="24" width="408" height="392" rx="10" fill="#171815"/></g>
<path d="M448 34a10 10 0 0 1 10-10h388a10 10 0 0 1 10 10v24H448z" fill="#22231f"/>
<circle cx="468" cy="41" r="5" fill="#ff5f57"/><circle cx="485" cy="41" r="5" fill="#febc2e"/><circle cx="502" cy="41" r="5" fill="#28c840"/>
<text x="652" y="45" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#9a9d93">claude — ~/acme</text>
<text x="470" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#9a9d93">~/acme $ claude</text>
<text x="470" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#f0452b">&gt;</text>
<clipPath id="c15396"><rect x="485" y="113" height="19" width="0"><animate attributeName="width" dur="12.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4083;0.4123;0.4163;0.4203;0.4243;0.4283;0.4322;0.4362;0.4402;0.4442;0.4482;0.4522;0.4562;0.4601;0.4641;0.4681;0.4721;0.4761;0.4801;0.4841;0.4880;0.4920;0.4960;0.5000;0.9500;0.9508;1.0000" values="0;0;9.8;17.7;25.5;33.4;41.2;49.1;56.9;64.8;72.6;80.5;88.3;96.2;104.0;111.9;119.8;127.6;135.4;143.3;151.2;159.0;166.8;174.7;182.5;184.54999999999998;0;0"/></rect></clipPath><text class="t1" x="486" y="126" clip-path="url(#c15396)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e9eae3">apply my latest redline</text>
<g class="l1"><text x="470" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9a9d93">● redline · get_edit_request</text>
  <text x="486" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e9eae3">#1 box · “make the button full width”</text></g>
<g class="l2"><text x="470" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9a9d93">● Edit  src/Checkout.tsx</text></g>
<g class="l3"><rect x="484" y="228" width="330" height="20" fill="#3a1d18"/><text x="490" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#ff8a75">- &lt;button className="px-6"&gt;</text>
  <rect x="484" y="248" width="330" height="20" fill="#16301f"/><text x="490" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#7fd99a">+ &lt;button className="w-full"&gt;</text></g>
<g class="l4"><text x="470" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9a9d93">● redline · update_edit_request_status</text>
  <text x="486" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e9eae3">#1 → review</text></g>
<g class="rv"><rect x="470" y="348" width="186" height="28" rx="14" fill="#3f7a4f" fill-opacity=".22" stroke="#3f7a4f"/>
  <text x="563" y="366" text-anchor="middle" font-size="12" font-weight="600" fill="#9fe0b1">✓ Ready for your review</text></g>
<rect class="caret" x="470" y="392" width="8" height="14" fill="#9a9d93"/>
</svg>