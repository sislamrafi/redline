<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="1440" height="900" fill="#f4f5f7"/>
  <!-- browser chrome -->
  <rect width="1440" height="44" fill="#e3e4e8"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f57"/><circle cx="42" cy="22" r="6" fill="#febc2e"/><circle cx="62" cy="22" r="6" fill="#28c840"/>
  <rect x="380" y="10" width="680" height="24" rx="6" fill="#fff"/>
  <text x="396" y="27" font-size="13" fill="#555">localhost:3000/dashboard</text>
  <!-- top nav -->
  <rect y="44" width="1440" height="60" fill="#ffffff"/>
  <rect y="103" width="1440" height="1" fill="#e5e7eb"/>
  <rect x="32" y="62" width="26" height="26" rx="6" fill="#6366f1"/>
  <text x="68" y="81" font-size="18" font-weight="700" fill="#111">Acme</text>
  <text x="180" y="80" font-size="14" fill="#111" font-weight="600">Dashboard</text>
  <text x="280" y="80" font-size="14" fill="#6b7280">Projects</text>
  <text x="365" y="80" font-size="14" fill="#6b7280">Team</text>
  <text x="430" y="80" font-size="14" fill="#6b7280">Reports</text>
  <rect x="1180" y="60" width="150" height="30" rx="6" fill="#d1d5db"/>
  <text x="1205" y="80" font-size="13" fill="#4b5563">Sign up free</text>
  <circle cx="1380" cy="75" r="16" fill="#c7d2fe"/>
  <!-- sidebar -->
  <rect x="0" y="104" width="220" height="796" fill="#ffffff"/>
  <rect x="219" y="104" width="1" height="796" fill="#e5e7eb"/>
  <rect x="16" y="128" width="188" height="34" rx="6" fill="#eef2ff"/>
  <text x="32" y="150" font-size="14" fill="#4338ca">Overview</text>
  <text x="32" y="196" font-size="14" fill="#374151">Analytics</text>
  <text x="32" y="236" font-size="14" fill="#374151">Customers</text>
  <text x="32" y="276" font-size="14" fill="#374151">Billing</text>
  <text x="32" y="316" font-size="14" fill="#374151">Settings</text>
  <!-- page -->
  <text x="260" y="160" font-size="26" font-weight="700" fill="#111">Overview</text>
  <text x="260" y="186" font-size="14" fill="#6b7280">Welcome back! Here's what happend this week.</text>
  <!-- stat cards -->
  <g>
    <rect x="260" y="216" width="270" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="284" y="250" font-size="13" fill="#6b7280">Revenue</text>
    <text x="284" y="292" font-size="30" font-weight="700" fill="#111">$48,210</text>
    <text x="284" y="318" font-size="12" fill="#16a34a">+12.4%</text>
    <rect x="554" y="216" width="270" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="578" y="250" font-size="13" fill="#6b7280">Active users</text>
    <text x="578" y="292" font-size="30" font-weight="700" fill="#111">2,931</text>
    <text x="578" y="318" font-size="12" fill="#16a34a">+4.1%</text>
    <rect x="848" y="216" width="270" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="872" y="250" font-size="13" fill="#6b7280">Churn</text>
    <text x="872" y="292" font-size="30" font-weight="700" fill="#111">1.8%</text>
    <text x="872" y="318" font-size="12" fill="#dc2626">+0.3%</text>
    <rect x="1142" y="216" width="270" height="120" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="1166" y="250" font-size="13" fill="#6b7280">NPS</text>
    <text x="1166" y="292" font-size="30" font-weight="700" fill="#111">61</text>
  </g>
  <!-- chart -->
  <rect x="260" y="362" width="858" height="320" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <text x="284" y="396" font-size="15" font-weight="600" fill="#111">Revenue over time</text>
  <polyline fill="none" stroke="#6366f1" stroke-width="3" points="290,640 380,610 470,620 560,560 650,575 740,520 830,500 920,470 1010,430 1090,440"/>
  <rect x="284" y="650" width="810" height="1" fill="#e5e7eb"/>
  <!-- table -->
  <rect x="1142" y="362" width="270" height="320" rx="10" fill="#fff" stroke="#e5e7eb"/>
  <text x="1166" y="396" font-size="15" font-weight="600" fill="#111">Recent signups</text>
  <text x="1166" y="436" font-size="13" fill="#374151">Maria Lopez</text><text x="1330" y="436" font-size="12" fill="#9ca3af">2m</text>
  <text x="1166" y="472" font-size="13" fill="#374151">Ken Tanaka</text><text x="1330" y="472" font-size="12" fill="#9ca3af">14m</text>
  <text x="1166" y="508" font-size="13" fill="#374151">Ada Obi</text><text x="1330" y="508" font-size="12" fill="#9ca3af">1h</text>
  <text x="1166" y="544" font-size="13" fill="#374151">Sam Reed</text><text x="1330" y="544" font-size="12" fill="#9ca3af">3h</text>
  <!-- footer button -->
  <rect x="260" y="710" width="140" height="40" rx="8" fill="#e5e7eb"/>
  <text x="290" y="735" font-size="14" fill="#6b7280">Export CSV</text>
</svg>
